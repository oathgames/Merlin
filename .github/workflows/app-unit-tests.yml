name: App unit tests

# Runs the node-based unit tests that live under `app/*.test.js`. These are
# plain-Node tests (no electron runtime required), gated to PRs that touch
# `app/` so we don't burn CI minutes on unrelated changes.
#
# The tests include source-scan regression checks — most importantly
# `app/ws-server.test.js`, which enforces that every `.listen()` in
# `app/*.js` binds to 127.0.0.1 only. Widening any bind would trigger a
# Windows Firewall prompt for every paying user on first launch (see
# CLAUDE.md rule 11 + the REGRESSION GUARD in `app/ws-server.js`).

on:
  push:
    paths:
      - 'app/**'
      - 'test/**'
      - '.github/workflows/app-unit-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'test/**'
      - '.github/workflows/app-unit-tests.yml'

jobs:
  test:
    name: Run app/*.test.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Most tests here use only Node stdlib plus in-file stubs (see
      # `app/relay-client.test.js` for the Module._resolveFilename trick that
      # stubs `ws` + `electron`), and new tests should keep doing that.
      #
      # REGRESSION GUARD (2026-07-25, ten-days-red incident): this step used to
      # be absent, per a comment saying "no npm install needed, add `npm ci`
      # here AND a package-lock.json commit if a test genuinely needs a
      # dependency." PR #323 (2026-07-15) added `app/ga-tool-fixes.test.js`,
      # which requires REAL zod to exercise defineTool's coerce/repair paths
      # (a stub cannot test zod's own semantics), but the `npm ci` half of that
      # instruction was never done. Every run of this workflow failed from
      # 2026-07-15 onward, so the sweep below silently stopped gating anything
      # and 8 PRs merged to main on a red canary nobody was reading.
      #
      # `--omit=dev` deliberately skips electron (~100MB, and every test that
      # touches it stubs it anyway); zod arrives transitively via
      # @anthropic-ai/claude-agent-sdk. Takes ~5s. If you add a test that needs
      # a devDependency, drop the flag rather than deleting the step.
      - name: Install production deps (real zod for the defineTool tests)
        run: npm ci --omit=dev --no-audit --no-fund
      # main.js parse-gate — the v1.17.0 launch-crash canary. A module-scope
      # `const stateFile = …` next to the existing `function stateFile(name)`
      # shipped in v1.17.0 bricked the app with `SyntaxError: Identifier
      # 'stateFile' has already been declared` on every install. This test
      # parses main.js with vm.Script and source-scans for the specific
      # identifier collision. If this flips red, DO NOT ship the release.
      - name: main.js duplicate-toplevel-ids lockdown
        run: node --test app/main-no-duplicate-toplevel-ids.test.js
      # Auth-error graceful fail — the v1.18.0 "raw 401 JSON in a chat
      # bubble followed by 3× retry" incident canary. Locks down both
      # the main.js interceptor (swallows SDK auth-error messages before
      # they hit sdk-message fan-out) AND the renderer.js fail-fast
      # branch (skips the retry loop and jumps straight to sign-in UI).
      - name: auth-error graceful fail lockdown
        run: node --test app/main-auth-error-intercept.test.js app/renderer-auth-error-fail-fast.test.js
      # Stale-resume graceful fail — the v1.18.1 "No conversation found
      # with session ID: <uuid>" incident canary. Locks down both the
      # main.js isResumeFailure regex (auto-clears thread + silent
      # restart) AND the renderer.js fail-fast branch (skips the 3x
      # retry loop on stale-resume and shows a 'Start Fresh Session'
      # button wired to startFreshSession IPC). Same incident shape as
      # the v1.18.0 auth loop — non-retryable error blindly retried 3x.
      - name: stale-resume graceful fail lockdown
        run: node --test app/main-stale-resume-regex.test.js app/renderer-stale-resume-fail-fast.test.js
      # Chat-hang fix — the v1.18.7 "3-minute hang after re-auth" incident
      # canary. Locks down (a) accountInfo() being detached from the
      # for-await message loop, (b) readCredentials() having a hard total
      # wall-clock cap, and (c) phase-aware progress wired through preload
      # + renderer so users always see what's actually happening during
      # session init (not a generic "Thinking" label).
      - name: sdk-chat-hang-fix lockdown
        run: node app/sdk-chat-hang-fix.test.js
      # Silent token refresh — the second half of the v1.18.7 incident.
      # The trigger for the "you must re-authenticate" prompt was a token
      # expiry that should have been refreshed silently by the SDK against
      # platform.claude.com/v1/oauth/token. Two regressions defeated it:
      # an early-rejection of expired tokens in extractToken(), and env-
      # injection of CLAUDE_CODE_OAUTH_TOKEN that forces the SDK off its
      # file-reading code path (which is the only path that knows about
      # the refresh token). Both are now locked down.
      - name: silent token refresh — helper behavior
        run: node app/auth-credentials.test.js
      - name: silent token refresh — main wiring lockdown
        run: node app/sdk-token-silent-refresh.test.js
      # Pre-PR guard: catch test fixtures that use the real Anthropic
      # token prefixes (sk-ant-oat01-, sk-ant-ort01-, sk-ant-api03-).
      # Even obviously-fake values like "sk-ant-oat01-abc" are flagged by
      # GitGuardian / TruffleHog as "Generic High Entropy Secret" the
      # moment a PR opens. This test fails fast in CI before the scanner
      # ever sees the diff. Live incident 2026-04-27 was the trigger.
      - name: no real Anthropic token prefixes in test fixtures
        run: node app/no-real-token-prefixes.test.js
      - name: ws-server listen-bind lockdown
        run: node app/ws-server.test.js
      - name: relay-client contract
        run: node app/relay-client.test.js
      - name: archive-scanner behavior
        run: node app/archive-scanner.test.js
      - name: archive campaign grouping (Archive "Ads" tab)
        run: node app/archive-campaign-group.test.js
      - name: oauth persist roundtrip
        run: node app/oauth-persist.test.js
      # Stale brand-config sweep: the 2026-07-13 "plaintext Meta tokens
      # stranded in %APPDATA%\Merlin" incident canary. The workspace split
      # migration parked pre-vault .merlin-config-<brand>.json files in a
      # directory no reader ever touched again. Locks down the vault-or-
      # delete boot sweep + its main.js wiring (every boot, no one-shot
      # gate, confirm-vault-write-before-delete).
      - name: stale brand-config sweep (plaintext-in-StateDir lockdown)
        run: node --test app/brand-config-sweep.test.js
      - name: sentence splitter
        run: node app/sentence-splitter.test.js
      - name: update-runner terminal-visibility lockdown
        run: node app/update-runner.test.js
      - name: tts-worker validation + ONNX backend matcher
        run: node --test app/tts-worker.test.js
      - name: transcription error humanizer
        run: node --test app/transcribe-error.test.js
      # MCP reliability primitives — the refactor that lets Merlin scale
      # from a single-SKU brand to a 30k-product catalog without getting
      # a client banned. Every primitive + its plumb-through has a test.
      - name: MCP envelope shape
        run: node --test app/mcp-envelope.test.js
      - name: MCP error code vocabulary
        run: node --test app/mcp-errors.test.js
      - name: MCP idempotency store
        run: node --test app/mcp-idempotency.test.js
      - name: MCP concurrency semaphore
        run: node --test app/mcp-concurrency.test.js
      - name: MCP preview/confirm gate
        run: node --test app/mcp-preview.test.js
      - name: MCP redact helpers
        run: node --test app/mcp-redact.test.js
      - name: MCP jobs store
        run: node --test app/mcp-jobs.test.js
      - name: MCP defineTool wrapper
        run: node --test app/mcp-define-tool.test.js
      - name: MCP tools registration
        run: node --test app/mcp-tools.test.js
      - name: MCP jobs tools
        run: node --test app/mcp-jobs-tools.test.js
      - name: MCP Meta intent tools
        run: node --test app/mcp-meta-intent.test.js
      # Meta MCP↔engine reachability — the "we shipped it and nobody
      # could call it" canary, in both directions. The param half
      # (2026-07-25) caught engine params no zod schema declared; the
      # action half (2026-07-26) caught whole engine actions no tool
      # named, including meta-list-adsets, plus meta-adlib, an action
      # the MCP layer routed to that the engine never had. Neither
      # failure produces a type error, a 404, or a log line on its own.
      - name: MCP Meta reachability (params + actions)
        run: node --test app/mcp-meta-param-reachability.test.js app/mcp-meta-action-reachability.test.js
      # Same failure class, GA4 surface. google-analytics-update-stream-settings
      # is the write half of a read that already shipped: audit-property has
      # long reported "Enhanced Measurement off" with no way to fix it from
      # Merlin. Its two params (analyticsStreamId, analyticsStreamSettings)
      # are declared-or-stripped in exactly the way Rule 23 describes, and the
      # nested boolean map makes a silent strip especially easy to miss.
      # The read half (2026-08-05) is the same class again, inverted: GA4
      # custom dimensions could be REGISTERED (create-custom-dimension) and
      # instrumented (gtm-install-quiz-funnel) but never READ BACK, because no
      # action anywhere could group or filter a report by one. Live on brand
      # "revive": four registered dimensions, an event firing correctly, and
      # "which quiz question do people abandon on" unanswerable from Merlin.
      - name: MCP Analytics reachability (params + write gate + dimension reads)
        run: node --test app/mcp-analytics-param-reachability.test.js app/mcp-analytics-event-breakdown-reachability.test.js
      # Rate-limit stress — the "never get a client banned" canary. If
      # any assertion flips, a real brand is about to hit a platform's
      # rate-limit review queue.
      - name: MCP rate-limit stress
        run: node --test app/mcp-ratelimit-stress.test.js
      # Annotation validator — every defineTool() call must declare
      # destructive/idempotent/costImpact/brandRequired, and destructive
      # tools must declare preview: true|false. Missing any = blast-radius
      # bypass shipped silently.
      - name: MCP annotation validator
        run: node test/validate-mcp-annotations.js
      # REGRESSION GUARD (2026-04-29, codex enterprise review fix #7):
      # Sweep every app/*.test.js the named steps above don't already
      # cover. The named steps stay because each is an incident canary
      # whose CI label is meaningful at-a-glance — but the count of
      # tests in app/ has historically drifted ahead of the named list
      # (74 on disk vs. 30 named at fix time), so any newly-added test
      # without a named entry above silently went un-run. The sweep
      # uses node:test's built-in runner, which works for both
      # `--test`-style and legacy `node file.js`-style tests (legacy
      # tests run as plain scripts; failures throw and the runner
      # records them). Re-running already-named tests here is cheap
      # and keeps the sweep stateless. If you add a long-running test
      # that should NOT be in the default CI sweep, gate it explicitly
      # (e.g. filename suffix `.slow.test.js`) and update this glob.
      - name: Sweep — run every app/*.test.js
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/*.test.js)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no app/*.test.js files found — sweep cannot run"
            exit 1
          fi
          echo "Sweep covering ${#files[@]} test files"
          node --test "${files[@]}"
